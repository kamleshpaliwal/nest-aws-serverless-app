name: PR checks

on:
  pull_request:
    branches: [main]

# id-token: write lets the job REQUEST a GitHub OIDC token (needed to assume the AWS role).
# contents: read is all the code checkout needs. Everything else is denied by default.
permissions:
  id-token: write
  contents: read

# A new push to the same PR cancels the older run.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # must match the Lambda runtime; Jest needs 24.9+ for Nest's ESM-only packages
          cache: npm # caches ~/.npm, keyed by the lockfiles below
          cache-dependency-path: |
            app/package-lock.json
            infra/package-lock.json

      # `npm ci` = clean install exactly from the lockfile (fails if package.json and lockfile disagree).
      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: Install infra dependencies
        run: npm ci
        working-directory: infra

      - name: Lint
        run: npm run lint
        working-directory: app

      - name: Unit tests
        run: npm test
        working-directory: app

      - name: Compile Lambda sources
        run: npm run build:lambda
        working-directory: app

      # TEMPORARY DEBUG STEP (remove once OIDC works): print the claims of the OIDC token
      # this run is issued, so we can compare `sub` and `aud` with the role's trust policy.
      # Only the decoded payload is printed; the token itself is never logged.
      - name: Debug - show OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const { iss, aud, sub, repository, ref, event_name, job_workflow_ref } = claims;
            core.info(JSON.stringify({ iss, aud, sub, repository, ref, event_name, job_workflow_ref }, null, 2));

      # Exchange the GitHub OIDC token for temporary credentials of the READ-ONLY plan role.
      - name: Assume AWS plan role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::933022260230:role/CiBootstrapStack-GithubPlanRoleA77EBD3A-Dg4WyCRwcNs1
          aws-region: ${{ env.AWS_REGION }}

      # Shows exactly what merging this PR would change in AWS. Changes nothing.
      - name: CDK diff
        run: npx cdk diff DocsApiStack -c alertEmail=${{ vars.ALERT_EMAIL }}
        working-directory: infra
